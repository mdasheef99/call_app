# Minimal CI for the published foundation. No Android/EAS builds, no
# accounts, no secrets, no paid services. Hosted runs only; see HANDOFF.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, review/foundation]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock
      # pytest runs from backend/ so the `app` package imports exactly
      # like the local documented command: python -m pytest tests -q
      - run: python -m pytest tests -q

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo export --platform web --output-dir dist-web

  voice-agent-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.lock -r backend/requirements-voice-dev.lock
      - run: pip check
      # Fail fast if voice deps are missing instead of silently skipping tests.
      - run: python -B -c "import sys; sys.path.insert(0, 'backend'); from tests.network_block import deny_outbound; deny_outbound(); import livekit.agents; import livekit.plugins.google.beta.realtime"
      # Offline only: no credentials, worker, room, or Google call.
      - run: python -m pytest backend/tests -q
        env:
          PYTHONPATH: backend

  voice-cascade-profile:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Deliberately separate from the incompatible native/foundation locks.
      - run: python -m pip install -r backend/requirements-voice-cascade.lock
      - run: python -m pip check
      # Wrong/missing profile fails before unittest can skip it; no provider calls.
      - run: python -B -c "from tests.network_block import deny_outbound; deny_outbound(); from voice_cascade_config import check_profile; check_profile()"
      - run: python -B -m unittest discover -s backend/tests/cascade_profile -v

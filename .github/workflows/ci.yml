# Minimal CI for the published foundation. No Android/EAS builds, no
# accounts, no secrets, no paid services. Hosted runs only; see HANDOFF.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, review/foundation]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock
      # pytest runs from backend/ so the `app` package imports exactly
      # like the local documented command: python -m pytest tests -q
      - run: python -m pytest tests -q

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo export --platform web --output-dir dist-web

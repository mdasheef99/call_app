# One-off native-compilation probe for PR #3 candidate 0c0751c.
# Probe branch ONLY — never merge, never add to PR #3 or main.
# Runs the previously failing :livekit_react-native:compileDebugKotlin
# on a standard GitHub-hosted runner. No assemble/sign/APK/upload.
name: probe-kotlin-compile

on:
  push:
    branches: [probe/kotlin-0c0751c]

permissions:
  contents: read

jobs:
  kotlin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 0c0751c2d8bb6f529d7b76d46853c0a5363e1ff4
      - name: Verify checkout SHA
        run: test "$(git rev-parse HEAD)" = "0c0751c2d8bb6f529d7b76d46853c0a5363e1ff4"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Record toolchain versions
        run: |
          node --version
          npm --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk"
          ls "$ANDROID_HOME/build-tools"
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Gradle WebRTC artifact resolution
        working-directory: mobile/android
        run: ./gradlew :livekit_react-native:dependencies --configuration debugRuntimeClasspath | grep -i -m5 webrtc || true
      - name: Compile previously failing task
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :livekit_react-native:compileDebugKotlin
